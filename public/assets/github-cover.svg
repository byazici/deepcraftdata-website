<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <!-- Background -->
  <rect width="1280" height="640" fill="#0a0e1a"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="320" x2="1280" y2="320" stroke="#1e293b" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="640" stroke="#1e293b" stroke-width="1"/>

  <!-- Icon: 3 stacked isometric layers (centered, large) -->
  <g transform="translate(640,260) scale(5.5)">
    <polygon points="-48,26 0,0  48,26 0,52" fill="#8b5cf6"/>
    <polygon points="-48,0  0,-26 48,0  0,26" fill="#3b82f6"/>
    <polygon points="-48,-26 0,-52 48,-26 0,0" fill="#22d3ee"/>
  </g>

  <!-- Wordmark below icon -->
  <text x="640" y="510"
        font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="52"
        font-weight="700"
        letter-spacing="4"
        text-anchor="middle"
        fill="#f1f5f9">DEEPCRAFT <tspan fill="#8b5cf6">DATA</tspan></text>

  <!-- Tagline -->
  <text x="640" y="570"
        font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="24"
        font-weight="400"
        letter-spacing="1"
        text-anchor="middle"
        fill="#64748b">PostgreSQL health. In plain English.</text>
</svg>
